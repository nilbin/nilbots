name: Manual release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: What should this run do?
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish-cli
          - publish
          - publish-and-deploy

concurrency:
  group: nilbots-manual-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/nilbots-runtime
  COMPILER_IMAGE: ghcr.io/${{ github.repository_owner }}/nilbots-compiler

jobs:
  verify:
    name: Verify source and WASM pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install WASI toolchain
        run: sudo bash scripts/setup-wasi-sdk.sh

      - name: Install web dependencies
        run: npm ci --prefix web --silent

      - name: Run end-to-end verification
        env:
          WASI_SDK_PATH: /opt/botarena/wasi-sdk-29.0
        run: bash scripts/e2e.sh

      # Deploying a server whose toolchain no published CLI bundles is how you get
      # version hell: `submit` refuses (DECISIONS #93) and the fix it prints —
      # `dotnet tool update -g Nilbots` — cannot work, because there is nothing to
      # update to. Publish the CLI for this revision BEFORE deploying it.
      - name: Require a published CLI for this revision
        if: inputs.operation == 'publish-and-deploy'
        run: bash scripts/assert-cli-release.sh published "$GITHUB_SHA"

      # Every release gets its own version, so the cli-v<version> tag below can say
      # which commit the published tool came from.
      - name: Require an unpublished CLI version
        if: inputs.operation == 'publish-cli'
        run: bash scripts/assert-cli-release.sh unpublished

      - name: Preserve generated CLI assets
        if: inputs.operation == 'publish-cli'
        uses: actions/upload-artifact@v4
        with:
          name: nilbots-cli-assets
          path: |
            artifacts/wasm/builtin-bots.wasm
            web/dist/index.html
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Require contract and PostgreSQL CI
    if: inputs.operation == 'publish' || inputs.operation == 'publish-and-deploy'
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish immutable images
    if: inputs.operation == 'publish' || inputs.operation == 'publish-and-deploy'
    needs:
      - verify
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      runtime-ref: ${{ steps.refs.outputs.runtime-ref }}
      compiler-ref: ${{ steps.refs.outputs.compiler-ref }}
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime image
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.RUNTIME_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and publish compiler image
        id: compiler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: compiler
          platforms: linux/amd64
          push: true
          tags: ${{ env.COMPILER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest runtime image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.RUNTIME_IMAGE }}
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true

      - name: Attest compiler image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.COMPILER_IMAGE }}
          subject-digest: ${{ steps.compiler.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image references
        id: refs
        shell: bash
        run: |
          echo "runtime-ref=${RUNTIME_IMAGE}@${{ steps.runtime.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "compiler-ref=${COMPILER_IMAGE}@${{ steps.compiler.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        env:
          RUNTIME_REF: ${{ steps.refs.outputs.runtime-ref }}
          COMPILER_REF: ${{ steps.refs.outputs.compiler-ref }}
        run: |
          {
            echo "## nilbots release"
            echo
            echo "- Git: \`${GITHUB_SHA}\`"
            echo "- Runtime: \`${RUNTIME_REF}\`"
            echo "- Compiler: \`${COMPILER_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-cli:
    name: Publish CLI to NuGet.org
    if: inputs.operation == 'publish-cli'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore generated CLI assets
        uses: actions/download-artifact@v4
        with:
          name: nilbots-cli-assets

      - name: Pack Nilbots global tool
        run: dotnet pack src/BotArena.Cli/BotArena.Cli.csproj --configuration Release --output artifacts/nuget

      - name: Smoke-test installed global tool
        run: bash scripts/test-packaged-cli.sh artifacts/nuget

      - name: Obtain short-lived NuGet.org credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish Nilbots global tool
        run: |
          dotnet nuget push "artifacts/nuget/Nilbots.*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

      # The record that ties a published tool to the commit that produced it.
      # Deploy accepts this exact revision or a later server-only revision whose
      # enumerated CLI compatibility inputs are byte-identical to this tag.
      - name: Tag the published CLI revision
        run: |
          version=$(sed -n 's/.*CliVersion = "\([^"]*\)".*/\1/p' \
            src/BotArena.Toolchain/BotProject.cs | head -1)
          git -c user.email=actions@github.com -c user.name="GitHub Actions" \
            tag -a "cli-v$version" -m "Nilbots $version published from $GITHUB_SHA"
          git push origin "cli-v$version"

  deploy:
    name: Deploy production
    if: inputs.operation == 'publish-and-deploy'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v6

      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.NILBOTS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NILBOTS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/nilbots-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/nilbots-deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy immutable image references
        env:
          DEPLOY_HOST: ${{ vars.NILBOTS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.NILBOTS_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.NILBOTS_DEPLOY_PATH }}
          RUNTIME_REF: ${{ needs.publish.outputs.runtime-ref }}
          COMPILER_REF: ${{ needs.publish.outputs.compiler-ref }}
        run: |
          deploy_node() {
            local install_operation="$1"
            local host="$2"
            local user="$3"
            local path="$4"
            [[ "$host" =~ ^[A-Za-z0-9.:-]+$ ]]
            [[ "$user" =~ ^[a-z_][a-z0-9_-]*$ ]]
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
            local incoming="$path/incoming/$GITHUB_SHA"
            ssh -i "$HOME/.ssh/nilbots-deploy" \
              -o BatchMode=yes \
              "$user@$host" "install -d -m 700 '$incoming'"
            scp -i "$HOME/.ssh/nilbots-deploy" \
              -o BatchMode=yes \
              "$bundle" \
              deploy/install-release.sh \
              "$user@$host:$incoming/"
            ssh -i "$HOME/.ssh/nilbots-deploy" \
              -o BatchMode=yes \
              "$user@$host" \
              "bash '$incoming/install-release.sh' '$install_operation' \
                '$path' '$GITHUB_SHA' '$RUNTIME_REF' '$COMPILER_REF' \
                '$incoming/$(basename "$bundle")' '$bundle_sha'"
          }

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          bundle="$RUNNER_TEMP/nilbots-deploy-$GITHUB_SHA.tar.gz"
          bash deploy/build-release-bundle.sh "$GITHUB_SHA" "$bundle"
          bundle_sha="$(sha256sum "$bundle" | awk '{ print $1 }')"
          deploy_node install-primary "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PATH"

          inventory="$RUNNER_TEMP/nilbots-workers.tsv"
          ssh -i "$HOME/.ssh/nilbots-deploy" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "if [[ -f '$DEPLOY_PATH/shared/workers.tsv' ]]; then
               cat '$DEPLOY_PATH/shared/workers.tsv'
             fi" >"$inventory"
          bash deploy/worker-inventory.sh validate "$inventory"
          bash deploy/worker-inventory.sh known-hosts "$inventory" \
            >>"$HOME/.ssh/known_hosts"

          while IFS=$'\t' read -r \
            worker_name worker_host worker_user worker_path; do
            test "$worker_host" != "$DEPLOY_HOST"
            echo "Deploying worker $worker_name ($worker_host)"
            deploy_node \
              install-worker \
              "$worker_host" \
              "$worker_user" \
              "$worker_path"
          done < <(bash deploy/worker-inventory.sh targets "$inventory")
