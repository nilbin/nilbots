[databases]
; The normal alias multiplexes short application transactions.
botarena = host=db port=5432 dbname=botarena pool_mode=transaction pool_size=30 reserve_pool_size=5 max_db_connections=35
; LISTEN/NOTIFY requires a backend connection that remains attached to the
; listener. Only notification listeners use this deliberately small pool.
botarena_session = host=db port=5432 dbname=botarena pool_mode=session pool_size=10 reserve_pool_size=0 max_db_connections=10

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /run/botarena-secrets/pgbouncer-userlist.txt

pool_mode = transaction
max_client_conn = 300
default_pool_size = 30
reserve_pool_size = 5
reserve_pool_timeout = 3
max_prepared_statements = 200

server_tls_sslmode = disable
client_tls_sslmode = disable
server_connect_timeout = 10
server_login_retry = 5
query_wait_timeout = 30
idle_transaction_timeout = 60

stats_period = 60
stats_users = botarena
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
application_name_add_host = 1
