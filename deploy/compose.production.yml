name: botarena

x-database-environment: &database-environment
  BOTARENA_DB: "Host=db;Database=botarena;Username=botarena;Password=${POSTGRES_PASSWORD}"
  BOTARENA_DATA: "/data"
  ASPNETCORE_ENVIRONMENT: "Production"

x-application-environment: &application-environment
  <<: *database-environment
  BOTARENA_OBJECT_STORE: "${BOTARENA_OBJECT_STORE:-s3}"
  BOTARENA_S3_ENDPOINT: "${BOTARENA_S3_ENDPOINT:-http://garage-gateway:3900}"
  BOTARENA_S3_ALLOW_HTTP: "${BOTARENA_S3_ALLOW_HTTP:-true}"
  BOTARENA_S3_REGION: "${BOTARENA_S3_REGION:-garage}"
  BOTARENA_S3_BUCKET: "${BOTARENA_S3_BUCKET:-nilbots}"
  BOTARENA_S3_ACCESS_KEY: "${BOTARENA_S3_ACCESS_KEY}"
  BOTARENA_S3_SECRET_KEY: "${BOTARENA_S3_SECRET_KEY}"
  BOTARENA_OBJECT_CACHE: "/cache"

x-runtime-build: &runtime-build
  context: ..
  target: runtime

x-garage-common: &garage-common
  image: "dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690"
  platform: linux/amd64
  restart: unless-stopped
  environment:
    GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET}"
    GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN}"
    GARAGE_METRICS_TOKEN: "${GARAGE_METRICS_TOKEN}"
  networks:
    - garage-rpc
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 256m
  healthcheck:
    test: ["CMD", "/garage", "node", "id", "--quiet"]
    interval: 10s
    timeout: 3s
    retries: 10

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: botarena
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: botarena
    ports:
      - "${BOTARENA_POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botarena -d botarena"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  garage-a:
    <<: *garage-common
    networks:
      garage-rpc:
        ipv4_address: 172.30.0.2
    volumes:
      - ./garage/garage-a.toml:/etc/garage.toml:ro
      - garage-a-data:/var/lib/garage

  garage-b:
    <<: *garage-common
    networks:
      garage-rpc:
        ipv4_address: 172.30.0.3
    volumes:
      - ./garage/garage-b.toml:/etc/garage.toml:ro
      - garage-b-data:/var/lib/garage

  garage-c:
    <<: *garage-common
    networks:
      garage-rpc:
        ipv4_address: 172.30.0.4
    volumes:
      - ./garage/garage-c.toml:/etc/garage.toml:ro
      - garage-c-data:/var/lib/garage

  garage-gateway:
    <<: *garage-common
    ports:
      - "${BOTARENA_GARAGE_BIND_ADDRESS:-127.0.0.1}:3900:3900"
    networks:
      backend:
      garage-rpc:
        ipv4_address: 172.30.0.5
    volumes:
      - ./garage/garage-gateway.toml:/etc/garage.toml:ro
      - garage-gateway-data:/var/lib/garage

  migrate:
    platform: linux/amd64
    image: "${BOTARENA_RUNTIME_IMAGE:-botarena-runtime:${BOTARENA_IMAGE_TAG:-local}}"
    build: *runtime-build
    environment:
      <<: *application-environment
      BOTARENA_ROLE: "migrate"
      BOTARENA_OBJECT_MIGRATION_SOURCE: "/data/objects"
    volumes:
      - objectdata:/data
      - migrationcache:/cache
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      garage-gateway:
        condition: service_healthy
    restart: "no"

  web:
    platform: linux/amd64
    image: "${BOTARENA_RUNTIME_IMAGE:-botarena-runtime:${BOTARENA_IMAGE_TAG:-local}}"
    build: *runtime-build
    restart: unless-stopped
    environment:
      <<: *application-environment
      BOTARENA_ROLE: "web"
      BOTARENA_TRUST_FORWARDED_HEADERS: "true"
      BOTARENA_OPENIDDICT_SIGNING_CERT: "/run/botarena-secrets/openiddict-signing.pfx"
      BOTARENA_OPENIDDICT_ENCRYPTION_CERT: "/run/botarena-secrets/openiddict-encryption.pfx"
      BOTARENA_OPENIDDICT_CERT_PASSWORD: "${BOTARENA_OPENIDDICT_CERT_PASSWORD}"
      BOTARENA_NETWORK_HASH_KEY: "${BOTARENA_NETWORK_HASH_KEY:-${BOTARENA_OPENIDDICT_CERT_PASSWORD}}"
      BOTARENA_COMPILE_ACCOUNT_10M: "${BOTARENA_COMPILE_ACCOUNT_10M:-6}"
      BOTARENA_COMPILE_ACCOUNT_DAILY: "${BOTARENA_COMPILE_ACCOUNT_DAILY:-30}"
      BOTARENA_COMPILE_NETWORK_10M: "${BOTARENA_COMPILE_NETWORK_10M:-12}"
      BOTARENA_COMPILE_NETWORK_DAILY: "${BOTARENA_COMPILE_NETWORK_DAILY:-60}"
      BOTARENA_COMPILE_ACCOUNT_QUEUED: "${BOTARENA_COMPILE_ACCOUNT_QUEUED:-2}"
      BOTARENA_COMPILE_GLOBAL_QUEUED: "${BOTARENA_COMPILE_GLOBAL_QUEUED:-20}"
    volumes:
      - objectdata:/data:ro
      - webcache:/cache
      - ./secrets:/run/botarena-secrets:ro
    networks:
      - edge
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${BOTARENA_WEB_MEMORY:-768m}"

  match-worker:
    platform: linux/amd64
    image: "${BOTARENA_RUNTIME_IMAGE:-botarena-runtime:${BOTARENA_IMAGE_TAG:-local}}"
    build: *runtime-build
    restart: unless-stopped
    environment:
      <<: *application-environment
      BOTARENA_ROLE: "match-worker"
      BOTARENA_INSTANCE_ID: "${BOTARENA_MATCH_INSTANCE_ID:-match-1}"
      BOTARENA_BROADCAST_TPS: "${BOTARENA_BROADCAST_TPS:-5}"
      BOTARENA_BROADCAST_DELAY_SECONDS: "${BOTARENA_BROADCAST_DELAY_SECONDS:-3}"
    volumes:
      - objectdata:/data
      - matchcache:/cache
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${BOTARENA_MATCH_MEMORY:-1g}"
    stop_grace_period: 2m

  compile-worker:
    platform: linux/amd64
    image: "${BOTARENA_RUNTIME_IMAGE:-botarena-runtime:${BOTARENA_IMAGE_TAG:-local}}"
    build: *runtime-build
    restart: unless-stopped
    environment:
      <<: *application-environment
      BOTARENA_ROLE: "compile-worker"
      BOTARENA_INSTANCE_ID: "${BOTARENA_COMPILE_INSTANCE_ID:-compile-1}"
      BOTARENA_COMPILE_WORKERS: "${BOTARENA_COMPILE_WORKERS:-1}"
      BOTARENA_COMPILER_IPC: "/compiler-ipc"
      BOTARENA_COMPILER_IMAGE_REFERENCE: "${BOTARENA_COMPILER_IMAGE:-local}"
      BOTARENA_RELEASE_GIT_SHA: "${BOTARENA_RELEASE_GIT_SHA:-local}"
    volumes:
      - objectdata:/data
      - compilecache:/cache
      - compileripc:/compiler-ipc
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      compiler-runner:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${BOTARENA_COMPILE_COORDINATOR_MEMORY:-512m}"
    cpus: "${BOTARENA_COMPILE_COORDINATOR_CPUS:-0.5}"
    stop_grace_period: 5m

  compiler-runner:
    platform: linux/amd64
    image: "${BOTARENA_COMPILER_IMAGE:-botarena-compiler:${BOTARENA_IMAGE_TAG:-local}}"
    build:
      context: ..
      target: compiler
    restart: unless-stopped
    environment:
      BOTARENA_ROLE: "compiler-runner"
      BOTARENA_COMPILER_IPC: "/compiler-ipc"
      BOTARENA_BUILD_TIMEOUT_SECONDS: "${BOTARENA_BUILD_TIMEOUT_SECONDS:-300}"
      WASI_SDK_PATH: "/opt/botarena/wasi-sdk-29.0"
    volumes:
      - compileripc:/compiler-ipc
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /work:size=${BOTARENA_COMPILE_WORKSPACE_SIZE:-1g},mode=0700,uid=1654,gid=1654
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 512
    mem_limit: "${BOTARENA_COMPILE_MEMORY:-3g}"
    cpus: "${BOTARENA_COMPILE_CPUS:-3}"
    ulimits:
      fsize:
        soft: 536870912
        hard: 536870912
      nofile:
        soft: 1024
        hard: 1024
      nproc:
        soft: 512
        hard: 512
    stop_grace_period: 6m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BOTARENA_DOMAIN: "${BOTARENA_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  dbdata:
  objectdata:
  migrationcache:
  webcache:
  matchcache:
  compilecache:
  garage-a-data:
  garage-b-data:
  garage-c-data:
  garage-gateway-data:
  compileripc:
  caddydata:
  caddyconfig:

networks:
  edge:
  backend:
  garage-rpc:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/28
