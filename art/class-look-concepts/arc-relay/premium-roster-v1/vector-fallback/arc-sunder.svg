      <ellipse fill="#06090d" fill-opacity="0.72" cx="256" cy="324" rx="142" ry="46"/>
      <path fill="#f1b74d" fill-opacity="0.38" d="M142 304h72l-22 48h-64Zm156 0h72l14 48h-64Z"/>
    </g>
    <g id="chassis-depth">
      <path d="m54 256 74-54-22-84 92 40 58-86 58 86 92-40-22 84 86 54-86 54 22 84-92-40-58 86-58-86-92 40 22-84Z" transform="translate(0 22)" fill="url(#sunder-side)" stroke="#05080d" stroke-width="18"/>
      <path d="m54 256 74-54-22-84 92 40 58-86 58 86 92-40-22 84 86 54-86 54 22 84-92-40-58 86-58-86-92 40 22-84Z" transform="translate(0 16)" fill="none" stroke="#332d3c" stroke-opacity=".46" stroke-width="5"/>
    </g>
    <g id="chassis" filter="url(#sunder-bevel)">
