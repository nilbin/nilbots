<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sunder">
  <defs>
    <linearGradient id="sunder-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#575160"/><stop offset=".42" stop-color="#211b2a"/><stop offset="1" stop-color="#000008"/>
    </linearGradient>
    <linearGradient id="sunder-plate" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#8b799e"/><stop offset=".38" stop-color="#59476c"/><stop offset="1" stop-color="#1f0d32"/>
    </linearGradient>
    <linearGradient id="sunder-hardware" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2dffc"/><stop offset=".46" stop-color="#b8a5c2"/><stop offset="1" stop-color="#7e6b88"/>
    </linearGradient>
    <linearGradient id="sunder-deep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2d2736"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="sunder-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#110b1a"/><stop offset=".44" stop-color="#000004"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="sunder-emissive">
      <stop stop-color="#fffdf0"/><stop offset=".25" stop-color="#fffb91"/><stop offset=".64" stop-color="#f1b74d"/><stop offset="1" stop-color="#995f00"/>
    </radialGradient>
    <pattern id="sunder-brush" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 2h18M0 11h18" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
      <path d="M0 7h18M0 16h18" stroke="#02050a" stroke-opacity=".24" stroke-width="1"/>
    </pattern>
    <clipPath id="sunder-clip"><path d="m54 256 74-54-22-84 92 40 58-86 58 86 92-40-22 84 86 54-86 54 22 84-92-40-58 86-58-86-92 40 22-84Z"/></clipPath>
    <filter id="sunder-bevel" x="-12%" y="-14%" width="128%" height="138%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="edge-blur"/>
      <feSpecularLighting in="edge-blur" surfaceScale="4.5" specularConstant=".42" specularExponent="16" lighting-color="#f7fbff" result="specular">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-cut"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="specular-cut"/></feMerge>
    </filter>
    <filter id="sunder-team-glow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="glow"/>
      <feComponentTransfer in="glow" result="soft-glow"><feFuncA type="linear" slope=".58"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
