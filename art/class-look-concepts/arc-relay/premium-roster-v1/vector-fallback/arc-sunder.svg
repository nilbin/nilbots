      <path fill="url(#sunder-plate)" stroke="#0b1118" stroke-width="7" d="m116 256 54-38-14-48 58 24 42-62 42 62 58-24-14 48 54 38-54 38 14 48-58-24-42 62-42-62-58 24 14-48Z"/>
      <g id="material-finish" clip-path="url(#sunder-clip)" opacity="0.22">
        <rect x="36" y="70" width="448" height="370" fill="url(#sunder-brush)"/>
      </g>
      <g id="armor-plates" fill="url(#sunder-plate)" stroke="#6f5d82" stroke-width="4">
        <path d="m116 238 58-42 50 20 32-52 34 54-42 32-106 14Z"/><path fill="#17052a" stroke="#3b294e" d="m142 280 106 14 42 32-34 54-32-52-50 20-58-42Z"/><path fill="url(#sunder-hardware)" stroke="#d0bdda" d="m306 210 52-24 42 48-68 22Z"/><path fill="#8a7794" stroke="#a693b0" d="m332 272 68 22-42 48-52-24Z"/>
      </g>
      <g id="surface-panels" fill="none" stroke="#9785aa" stroke-opacity=".58" stroke-width="5">
        <path d="m122 234 52-36 54 20 28-42 28 42 54-20 52 36M122 278l52 36 54-20 28 42 28-42 54 20 52-36"/>
      </g>
      <g id="panel-shadows" fill="none" stroke="#000000" stroke-opacity=".78" stroke-width="4" transform="translate(0 5)">
        <path d="m122 234 52-36 54 20 28-42 28 42 54-20 52 36M122 278l52 36 54-20 28 42 28-42 54 20 52-36"/>
      </g>
      <g id="fasteners" fill="#e2cfec" stroke="#090d12" stroke-width="3">
        <circle cx="154" cy="210" r="6"/><circle cx="154" cy="302" r="6"/><circle cx="358" cy="210" r="6"/><circle cx="358" cy="302" r="6"/>
      </g>
    </g>
    <g id="hardware-depth">
      <path fill="#000000" stroke="#070a0f" stroke-width="6" d="m184 256 88-68 102 68-102 68Z" transform="translate(0 9)"/>
      <path fill="#000000" stroke="#070a0f" stroke-width="5" d="m276 212 100 44-100 44 28-44Z" transform="translate(0 9)"/>
    </g>
    <g id="weapon-hardware">
      <path fill="url(#sunder-hardware)" stroke="#0b1118" stroke-width="6" d="m184 256 88-68 102 68-102 68Z"/>
      <path fill="url(#sunder-deep)" stroke="#0b1118" stroke-width="5" d="m276 212 100 44-100 44 28-44Z"/>
      <g id="signature-machinery" fill="none" stroke="#eedbf8" stroke-width="6" stroke-opacity=".88">
        <circle cx="286" cy="256" r="54"/><circle cx="286" cy="256" r="26"/><path d="M286 180v42m0 68v42M210 256h42m68 0h76"/>
      </g>
    </g>
    <g id="team-accents" filter="url(#sunder-team-glow)">
      <path data-team-accent="true" fill="#38bdf8" d="m130 204 62-50 22 30-62 50Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m130 308 62 50 22-30-62-50Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m362 224 82 32-82 32 20-32Z"/>
    </g>
    <g id="emissives">
      <circle fill="none" stroke="url(#sunder-emissive)" stroke-width="16" cx="286" cy="256" r="38"/>
      <circle fill="#fff9dc" fill-opacity="0.78" cx="286" cy="256" r="4"/>
