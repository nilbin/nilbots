<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hush">
  <defs>
    <linearGradient id="hush-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4b4a53"/><stop offset=".42" stop-color="#15141d"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="hush-plate" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#6a647d"/><stop offset=".38" stop-color="#38324b"/><stop offset="1" stop-color="#000011"/>
    </linearGradient>
    <linearGradient id="hush-hardware" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b29fc9"/><stop offset=".46" stop-color="#78658f"/><stop offset="1" stop-color="#3e2b55"/>
    </linearGradient>
    <linearGradient id="hush-deep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#212029"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="hush-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#05040d"/><stop offset=".44" stop-color="#000000"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="hush-emissive">
      <stop stop-color="#fffdf0"/><stop offset=".25" stop-color="#fffb9e"/><stop offset=".64" stop-color="#d8b75a"/><stop offset="1" stop-color="#805f02"/>
    </radialGradient>
    <pattern id="hush-brush" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 2h18M0 11h18" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
      <path d="M0 7h18M0 16h18" stroke="#02050a" stroke-opacity=".24" stroke-width="1"/>
    </pattern>
    <clipPath id="hush-clip"><path d="M62 256 150 132 250 190 338 94 454 204 482 256 454 308 338 418 250 322 150 380Z"/></clipPath>
    <filter id="hush-bevel" x="-12%" y="-14%" width="128%" height="138%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="edge-blur"/>
      <feSpecularLighting in="edge-blur" surfaceScale="4.5" specularConstant=".42" specularExponent="16" lighting-color="#f7fbff" result="specular">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-cut"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="specular-cut"/></feMerge>
    </filter>
    <filter id="hush-team-glow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="glow"/>
      <feComponentTransfer in="glow" result="soft-glow"><feFuncA type="linear" slope=".58"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g id="underbody-locomotion">
      <ellipse fill="#06090d" fill-opacity="0.72" cx="256" cy="324" rx="142" ry="46"/>
      <path fill="#d8b75a" fill-opacity="0.38" d="M142 304h72l-22 48h-64Zm156 0h72l14 48h-64Z"/>
    </g>
    <g id="chassis-depth">
      <path d="M62 256 150 132 250 190 338 94 454 204 482 256 454 308 338 418 250 322 150 380Z" transform="translate(0 22)" fill="url(#hush-side)" stroke="#05080d" stroke-width="18"/>
      <path d="M62 256 150 132 250 190 338 94 454 204 482 256 454 308 338 418 250 322 150 380Z" transform="translate(0 16)" fill="none" stroke="#27262f" stroke-opacity=".46" stroke-width="5"/>
    </g>
    <g id="chassis" filter="url(#hush-bevel)">
      <path fill="url(#hush-chassis)" stroke="#0b1118" stroke-width="18" d="M62 256 150 132 250 190 338 94 454 204 482 256 454 308 338 418 250 322 150 380Z"/>
      <path fill="url(#hush-plate)" stroke="#0b1118" stroke-width="7" d="M116 256 172 180 252 220 334 144 414 218 444 256 414 294 334 368 252 292 172 332Z"/>
      <g id="material-finish" clip-path="url(#hush-clip)" opacity="0.22">
        <rect x="36" y="70" width="448" height="370" fill="url(#hush-brush)"/>
      </g>
      <g id="armor-plates" fill="url(#hush-plate)" stroke="#4e4861" stroke-width="4">
        <path d="m112 246 64-82 78 46-44 38-82 18Z"/><path fill="#000009" stroke="#1a142d" d="m128 280 82 18 44 38-78 46-64-82Z"/><path fill="url(#hush-hardware)" stroke="#907da7" d="m270 202 62-58 74 70-82 34Z"/><path fill="#4a3761" stroke="#66537d" d="m324 264 82 34-74 70-62-58Z"/>
      </g>
      <g id="surface-panels" fill="none" stroke="#767089" stroke-opacity=".58" stroke-width="5">
        <path d="m128 242 54-72 70 36 80-70 74 70M128 270l54 72 70-36 80 70 74-70M186 236l42 20-42 20"/>
      </g>
      <g id="panel-shadows" fill="none" stroke="#000000" stroke-opacity=".78" stroke-width="4" transform="translate(0 5)">
        <path d="m128 242 54-72 70 36 80-70 74 70M128 270l54 72 70-36 80 70 74-70M186 236l42 20-42 20"/>
      </g>
      <g id="fasteners" fill="#a28fb9" stroke="#090d12" stroke-width="3">
        <circle cx="164" cy="204" r="6"/><circle cx="164" cy="308" r="6"/><circle cx="362" cy="188" r="6"/><circle cx="362" cy="324" r="6"/>
      </g>
    </g>
    <g id="hardware-depth">
      <path fill="#000000" stroke="#070a0f" stroke-width="6" d="M170 256c48-76 148-92 232-24l28 24-28 24c-84 68-184 52-232-24Z" transform="translate(0 9)"/>
      <path fill="#000000" d="M226 256c34-34 88-40 140-12l20 12-20 12c-52 28-106 22-140-12Z" transform="translate(0 9)"/>
    </g>
    <g id="weapon-hardware">
      <path fill="url(#hush-deep)" stroke="#0b1118" stroke-width="6" d="M170 256c48-76 148-92 232-24l28 24-28 24c-84 68-184 52-232-24Z"/>
      <path fill="url(#hush-hardware)" d="M226 256c34-34 88-40 140-12l20 12-20 12c-52 28-106 22-140-12Z"/>
      <g id="signature-machinery" fill="none" stroke="#ae9bc5" stroke-width="6" stroke-opacity=".88">
        <path d="M194 256c42-56 126-66 194-18m-194 18c42 56 126 66 194 18"/><path d="M246 236h92m-92 40h92"/>
      </g>
    </g>
    <g id="team-accents" filter="url(#hush-team-glow)">
      <path data-team-accent="true" fill="#38bdf8" d="m126 206 70-48 18 32-68 48Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m126 306 70 48 18-32-68-48Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m382 224 52 32-52 32 14-32Z"/>
    </g>
    <g id="emissives">
      <ellipse fill="url(#hush-emissive)" cx="292" cy="256" rx="24" ry="12"/>
      <circle fill="#fff9dc" fill-opacity="0.78" cx="292" cy="256" r="4"/>
    </g>
  </g>
</svg>
