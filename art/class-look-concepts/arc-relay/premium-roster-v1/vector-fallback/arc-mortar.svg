<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mortar">
  <defs>
    <linearGradient id="mortar-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5b6058"/><stop offset=".42" stop-color="#252a22"/><stop offset="1" stop-color="#030800"/>
    </linearGradient>
    <linearGradient id="mortar-plate" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#98a284"/><stop offset=".38" stop-color="#667052"/><stop offset="1" stop-color="#2c3618"/>
    </linearGradient>
    <linearGradient id="mortar-hardware" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d4b688"/><stop offset=".46" stop-color="#9a7c4e"/><stop offset="1" stop-color="#604214"/>
    </linearGradient>
    <linearGradient id="mortar-deep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#31362e"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="mortar-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#151a12"/><stop offset=".44" stop-color="#000400"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="mortar-emissive">
      <stop stop-color="#fffdf0"/><stop offset=".25" stop-color="#ffe583"/><stop offset=".64" stop-color="#f0a13f"/><stop offset="1" stop-color="#984900"/>
    </radialGradient>
    <pattern id="mortar-brush" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 2h18M0 11h18" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
      <path d="M0 7h18M0 16h18" stroke="#02050a" stroke-opacity=".24" stroke-width="1"/>
    </pattern>
    <clipPath id="mortar-clip"><path d="M72 194 164 132 316 132 406 188 450 256 406 324 316 380 164 380 72 318Z"/></clipPath>
    <filter id="mortar-bevel" x="-12%" y="-14%" width="128%" height="138%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="edge-blur"/>
      <feSpecularLighting in="edge-blur" surfaceScale="4.5" specularConstant=".42" specularExponent="16" lighting-color="#f7fbff" result="specular">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-cut"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="specular-cut"/></feMerge>
    </filter>
    <filter id="mortar-team-glow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="glow"/>
      <feComponentTransfer in="glow" result="soft-glow"><feFuncA type="linear" slope=".58"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g id="underbody-locomotion">
      <rect fill="#090c10" stroke="#0b1118" stroke-width="14" x="106" y="126" width="250" height="76" rx="34"/>
      <rect fill="#090c10" stroke="#0b1118" stroke-width="14" x="106" y="310" width="250" height="76" rx="34"/>
      <path fill="none" stroke="#586069" stroke-width="12" stroke-dasharray="24 14" d="M132 164h198M132 348h198"/>
    </g>
    <g id="chassis-depth">
      <path d="M72 194 164 132 316 132 406 188 450 256 406 324 316 380 164 380 72 318Z" transform="translate(0 22)" fill="url(#mortar-side)" stroke="#05080d" stroke-width="18"/>
      <path d="M72 194 164 132 316 132 406 188 450 256 406 324 316 380 164 380 72 318Z" transform="translate(0 16)" fill="none" stroke="#373c34" stroke-opacity=".46" stroke-width="5"/>
    </g>
    <g id="chassis" filter="url(#mortar-bevel)">
      <path fill="url(#mortar-chassis)" stroke="#0b1118" stroke-width="18" d="M72 194 164 132 316 132 406 188 450 256 406 324 316 380 164 380 72 318Z"/>
      <path fill="url(#mortar-plate)" stroke="#0b1118" stroke-width="7" d="M112 210 188 168h114l64 42 30 46-30 46-64 42H188l-76-42Z"/>
      <g id="material-finish" clip-path="url(#mortar-clip)" opacity="0.22">
        <rect x="36" y="70" width="448" height="370" fill="url(#mortar-brush)"/>
      </g>
      <g id="armor-plates" fill="url(#mortar-plate)" stroke="#7c8668" stroke-width="4">
        <path d="M112 220 184 176h74l-36 52-92 24Z"/><path fill="#242e10" stroke="#485234" d="m130 270 92 24 36 52h-74l-72-44Z"/><path fill="url(#mortar-hardware)" stroke="#b29466" d="m274 170 54 12 52 34-70 22-52-18Z"/><path fill="#6c4e20" stroke="#886a3c" d="m258 292 52-18 70 22-52 34-54 12Z"/>
      </g>
      <g id="surface-panels" fill="none" stroke="#a4ae90" stroke-opacity=".58" stroke-width="5">
        <path d="M126 214 194 178h102M126 298l68 36h102M148 240h72m-72 32h72"/>
      </g>
      <g id="panel-shadows" fill="none" stroke="#000000" stroke-opacity=".78" stroke-width="4" transform="translate(0 5)">
        <path d="M126 214 194 178h102M126 298l68 36h102M148 240h72m-72 32h72"/>
      </g>
      <g id="fasteners" fill="#c4a678" stroke="#090d12" stroke-width="3">
        <circle cx="152" cy="204" r="6"/><circle cx="152" cy="308" r="6"/><circle cx="286" cy="176" r="6"/><circle cx="286" cy="336" r="6"/>
      </g>
    </g>
    <g id="hardware-depth">
      <ellipse fill="#000000" stroke="#070a0f" stroke-width="7" cx="260" cy="256" rx="98" ry="74" transform="translate(0 9)"/>
      <ellipse fill="#000000" stroke="#070a0f" stroke-width="6" cx="318" cy="256" rx="58" ry="48" transform="translate(0 9)"/>
      <ellipse fill="#000000" stroke="#070a0f" stroke-width="5" cx="336" cy="256" rx="28" ry="24" transform="translate(0 9)"/>
    </g>
    <g id="weapon-hardware">
      <ellipse fill="url(#mortar-hardware)" stroke="#0b1118" stroke-width="7" cx="260" cy="256" rx="98" ry="74"/>
      <ellipse fill="url(#mortar-deep)" stroke="#0b1118" stroke-width="6" cx="318" cy="256" rx="58" ry="48"/>
      <ellipse fill="url(#mortar-plate)" stroke="#0b1118" stroke-width="5" cx="336" cy="256" rx="28" ry="24"/>
      <g id="signature-machinery" fill="none" stroke="#d0b284" stroke-width="6" stroke-opacity=".88">
        <ellipse cx="318" cy="256" rx="72" ry="60"/><ellipse cx="336" cy="256" rx="42" ry="34"/><path d="M224 212 318 180m-94 120 94 32"/>
      </g>
    </g>
    <g id="team-accents" filter="url(#mortar-team-glow)">
      <rect data-team-accent="true" fill="#38bdf8" x="106" y="220" width="38" height="72" rx="14"/>
      <path data-team-accent="true" fill="#38bdf8" d="m204 174 74-12 8 32-76 16Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m204 338 74 12 8-32-76-16Z"/>
    </g>
    <g id="emissives">
      <circle fill="url(#mortar-emissive)" cx="336" cy="256" r="12"/>
      <circle fill="#fff9dc" fill-opacity="0.78" cx="336" cy="256" r="4"/>
    </g>
  </g>
</svg>
