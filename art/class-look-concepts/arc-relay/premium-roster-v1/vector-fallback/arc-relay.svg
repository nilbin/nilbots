<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Relay">
  <defs>
    <linearGradient id="relay-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#665a63"/><stop offset=".42" stop-color="#30242d"/><stop offset="1" stop-color="#0e020b"/>
    </linearGradient>
    <linearGradient id="relay-plate" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#b89275"/><stop offset=".38" stop-color="#866043"/><stop offset="1" stop-color="#4c2609"/>
    </linearGradient>
    <linearGradient id="relay-hardware" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efd0a7"/><stop offset=".46" stop-color="#b5966d"/><stop offset="1" stop-color="#7b5c33"/>
    </linearGradient>
    <linearGradient id="relay-deep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3c3039"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="relay-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#20141d"/><stop offset=".44" stop-color="#0a0007"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="relay-emissive">
      <stop stop-color="#fffdf0"/><stop offset=".25" stop-color="#ffffac"/><stop offset=".64" stop-color="#f2c268"/><stop offset="1" stop-color="#9a6a10"/>
    </radialGradient>
    <pattern id="relay-brush" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 2h18M0 11h18" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
      <path d="M0 7h18M0 16h18" stroke="#02050a" stroke-opacity=".24" stroke-width="1"/>
    </pattern>
    <clipPath id="relay-clip"><path d="M82 194 168 134 288 134 376 176 446 232 446 280 376 336 288 378 168 378 82 318Z"/></clipPath>
    <filter id="relay-bevel" x="-12%" y="-14%" width="128%" height="138%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="edge-blur"/>
      <feSpecularLighting in="edge-blur" surfaceScale="4.5" specularConstant=".42" specularExponent="16" lighting-color="#f7fbff" result="specular">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-cut"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="specular-cut"/></feMerge>
    </filter>
    <filter id="relay-team-glow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="glow"/>
      <feComponentTransfer in="glow" result="soft-glow"><feFuncA type="linear" slope=".58"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g id="underbody-locomotion">
      <path fill="none" stroke="#080b0f" stroke-width="30" d="M126 170 190 144M126 342l64 26M324 144l74 30M324 368l74-30"/>
      <path fill="none" stroke="#747a7d" stroke-width="9" d="M132 164 194 140M132 348l62 24M322 140l80 28M322 372l80-28"/>
    </g>
    <g id="chassis-depth">
      <path d="M82 194 168 134 288 134 376 176 446 232 446 280 376 336 288 378 168 378 82 318Z" transform="translate(0 22)" fill="url(#relay-side)" stroke="#05080d" stroke-width="18"/>
      <path d="M82 194 168 134 288 134 376 176 446 232 446 280 376 336 288 378 168 378 82 318Z" transform="translate(0 16)" fill="none" stroke="#42363f" stroke-opacity=".46" stroke-width="5"/>
    </g>
    <g id="chassis" filter="url(#relay-bevel)">
      <path fill="url(#relay-chassis)" stroke="#0b1118" stroke-width="18" d="M82 194 168 134 288 134 376 176 446 232 446 280 376 336 288 378 168 378 82 318Z"/>
      <path fill="url(#relay-plate)" stroke="#0b1118" stroke-width="7" d="M126 212 190 170h90l66 32 52 42v24l-52 42-66 32h-90l-64-42Z"/>
      <g id="material-finish" clip-path="url(#relay-clip)" opacity="0.22">
        <rect x="36" y="70" width="448" height="370" fill="url(#relay-brush)"/>
      </g>
      <g id="armor-plates" fill="url(#relay-plate)" stroke="#9c7659" stroke-width="4">
        <path d="M120 222 188 176h64l-30 58-88 20Z"/><path fill="#441e01" stroke="#684225" d="m134 272 88 20 30 58h-64l-68-46Z"/><path fill="url(#relay-hardware)" stroke="#cdae85" d="m286 190 56 24 48 34-72 10-46-28Z"/><path fill="#87683f" stroke="#a3845b" d="m318 274 72 10-48 34-56 24-14-40Z"/>
      </g>
      <g id="surface-panels" fill="none" stroke="#c49e81" stroke-opacity=".58" stroke-width="5">
        <path d="M132 214 194 174h84l62 30M132 298l62 40h84l62-30M152 238h62m-62 36h62"/>
      </g>
      <g id="panel-shadows" fill="none" stroke="#040001" stroke-opacity=".78" stroke-width="4" transform="translate(0 5)">
        <path d="M132 214 194 174h84l62 30M132 298l62 40h84l62-30M152 238h62m-62 36h62"/>
      </g>
      <g id="fasteners" fill="#dfc097" stroke="#090d12" stroke-width="3">
        <circle cx="154" cy="204" r="6"/><circle cx="154" cy="308" r="6"/><circle cx="336" cy="216" r="6"/><circle cx="336" cy="296" r="6"/>
      </g>
    </g>
    <g id="hardware-depth">
      <circle fill="#020000" stroke="#070a0f" stroke-width="6" cx="244" cy="256" r="84" transform="translate(0 9)"/>
      <circle fill="#020000" stroke="#070a0f" stroke-width="6" cx="244" cy="256" r="48" transform="translate(0 9)"/>
      <path fill="none" stroke="#070a0f" stroke-width="22" stroke-linecap="round" d="M280 204c54-34 104-16 136 34M280 308c54 34 104 16 136-34" transform="translate(0 9)"/>
    </g>
    <g id="weapon-hardware">
      <circle fill="url(#relay-hardware)" stroke="#0b1118" stroke-width="6" cx="244" cy="256" r="84"/>
      <circle fill="url(#relay-deep)" stroke="#0b1118" stroke-width="6" cx="244" cy="256" r="48"/>
      <path fill="none" stroke="url(#relay-hardware)" stroke-width="22" stroke-linecap="round" d="M280 204c54-34 104-16 136 34M280 308c54 34 104 16 136-34"/>
      <g id="signature-machinery" fill="none" stroke="#ebcca3" stroke-width="6" stroke-opacity=".88">
        <circle cx="244" cy="256" r="66"/><path d="M282 210q54-30 120 28M282 302q54 30 120-28"/><path d="M318 226v60"/>
      </g>
    </g>
    <g id="team-accents" filter="url(#relay-team-glow)">
      <path data-team-accent="true" fill="#38bdf8" d="m128 204 62-38 16 32-62 40Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m128 308 62 38 16-32-62-40Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m380 224 62 32-62 32 18-32Z"/>
    </g>
    <g id="emissives">
      <circle fill="url(#relay-emissive)" cx="244" cy="256" r="22"/>
      <circle fill="#fff9dc" fill-opacity="0.78" cx="244" cy="256" r="4"/>
    </g>
  </g>
</svg>
