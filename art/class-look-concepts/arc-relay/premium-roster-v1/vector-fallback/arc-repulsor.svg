<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Repulsor">
  <defs>
    <linearGradient id="repulsor-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#625659"/><stop offset=".42" stop-color="#2c2023"/><stop offset="1" stop-color="#0a0001"/>
    </linearGradient>
    <linearGradient id="repulsor-plate" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#a3777c"/><stop offset=".38" stop-color="#71454a"/><stop offset="1" stop-color="#370b10"/>
    </linearGradient>
    <linearGradient id="repulsor-hardware" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d5c2ba"/><stop offset=".46" stop-color="#9b8880"/><stop offset="1" stop-color="#614e46"/>
    </linearGradient>
    <linearGradient id="repulsor-deep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#382c2f"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="repulsor-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1c1013"/><stop offset=".44" stop-color="#060000"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="repulsor-emissive">
      <stop stop-color="#fffdf0"/><stop offset=".25" stop-color="#ffff99"/><stop offset=".64" stop-color="#f3bc55"/><stop offset="1" stop-color="#9b6400"/>
    </radialGradient>
    <pattern id="repulsor-brush" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 2h18M0 11h18" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
      <path d="M0 7h18M0 16h18" stroke="#02050a" stroke-opacity=".24" stroke-width="1"/>
    </pattern>
    <clipPath id="repulsor-clip"><path d="M94 158 190 88h132l96 70 62 98-62 98-96 70H190l-96-70-62-98Z"/></clipPath>
    <filter id="repulsor-bevel" x="-12%" y="-14%" width="128%" height="138%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="edge-blur"/>
      <feSpecularLighting in="edge-blur" surfaceScale="4.5" specularConstant=".42" specularExponent="16" lighting-color="#f7fbff" result="specular">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-cut"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="specular-cut"/></feMerge>
    </filter>
    <filter id="repulsor-team-glow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="glow"/>
      <feComponentTransfer in="glow" result="soft-glow"><feFuncA type="linear" slope=".58"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g id="underbody-locomotion">
      <rect fill="#090c10" stroke="#0b1118" stroke-width="14" x="106" y="126" width="250" height="76" rx="34"/>
      <rect fill="#090c10" stroke="#0b1118" stroke-width="14" x="106" y="310" width="250" height="76" rx="34"/>
      <path fill="none" stroke="#586069" stroke-width="12" stroke-dasharray="24 14" d="M132 164h198M132 348h198"/>
    </g>
    <g id="chassis-depth">
      <path d="M94 158 190 88h132l96 70 62 98-62 98-96 70H190l-96-70-62-98Z" transform="translate(0 22)" fill="url(#repulsor-side)" stroke="#05080d" stroke-width="18"/>
      <path d="M94 158 190 88h132l96 70 62 98-62 98-96 70H190l-96-70-62-98Z" transform="translate(0 16)" fill="none" stroke="#3e3235" stroke-opacity=".46" stroke-width="5"/>
    </g>
    <g id="chassis" filter="url(#repulsor-bevel)">
      <path fill="url(#repulsor-chassis)" stroke="#0b1118" stroke-width="18" d="M94 158 190 88h132l96 70 62 98-62 98-96 70H190l-96-70-62-98Z"/>
      <path fill="url(#repulsor-plate)" stroke="#0b1118" stroke-width="7" d="m132 178 76-50h96l76 50 46 78-46 78-76 50h-96l-76-50-46-78Z"/>
      <g id="material-finish" clip-path="url(#repulsor-clip)" opacity="0.22">
        <rect x="36" y="70" width="448" height="370" fill="url(#repulsor-brush)"/>
      </g>
      <g id="armor-plates" fill="url(#repulsor-plate)" stroke="#875b60" stroke-width="4">
        <path d="m126 196 78-52h62l-22 78-88 38-48-10Z"/><path fill="#2f0308" stroke="#53272c" d="m108 270 48-10 88 38 22 78h-62l-78-52Z"/><path fill="url(#repulsor-hardware)" stroke="#b3a098" d="m290 144 76 52 34 60-86-18-50-50Z"/><path fill="#6d5a52" stroke="#89766e" d="m314 274 86-18-34 60-76 52-26-44Z"/>
      </g>
      <g id="surface-panels" fill="none" stroke="#af8388" stroke-opacity=".58" stroke-width="5">
        <path d="m136 186 74-48h92l74 48 42 70-42 70-74 48h-92l-74-48-42-70Z"/><circle cx="278" cy="256" r="94"/>
      </g>
      <g id="panel-shadows" fill="none" stroke="#000000" stroke-opacity=".78" stroke-width="4" transform="translate(0 5)">
        <path d="m136 186 74-48h92l74 48 42 70-42 70-74 48h-92l-74-48-42-70Z"/><circle cx="278" cy="256" r="94"/>
      </g>
      <g id="fasteners" fill="#c5b2aa" stroke="#090d12" stroke-width="3">
        <circle cx="194" cy="142" r="6"/><circle cx="194" cy="370" r="6"/><circle cx="362" cy="184" r="6"/><circle cx="362" cy="328" r="6"/>
      </g>
    </g>
    <g id="hardware-depth">
      <circle fill="#000000" stroke="#070a0f" stroke-width="7" cx="278" cy="256" r="112" transform="translate(0 9)"/>
      <circle fill="#000000" stroke="#070a0f" stroke-width="6" cx="278" cy="256" r="72" transform="translate(0 9)"/>
      <circle fill="#000000" stroke="#070a0f" stroke-width="5" cx="278" cy="256" r="34" transform="translate(0 9)"/>
    </g>
    <g id="weapon-hardware">
      <circle fill="url(#repulsor-hardware)" stroke="#0b1118" stroke-width="7" cx="278" cy="256" r="112"/>
      <circle fill="url(#repulsor-chassis)" stroke="#0b1118" stroke-width="6" cx="278" cy="256" r="72"/>
      <circle fill="url(#repulsor-plate)" stroke="#0b1118" stroke-width="5" cx="278" cy="256" r="34"/>
      <g id="signature-machinery" fill="none" stroke="#d1beb6" stroke-width="6" stroke-opacity=".88">
        <circle cx="278" cy="256" r="92"/><circle cx="278" cy="256" r="56"/><path d="M278 136v54m0 132v54M158 256h54m132 0h82M194 172l38 38m92 92 38 38m0-168-38 38m-92 92-38 38"/>
      </g>
    </g>
    <g id="team-accents" filter="url(#repulsor-team-glow)">
      <path data-team-accent="true" fill="#38bdf8" d="m278 146 34 6-8 48-26-6Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m278 366 34-6-8-48-26 6Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m384 224 70 32-70 32 18-32Z"/>
    </g>
    <g id="emissives">
      <circle fill="url(#repulsor-emissive)" cx="278" cy="256" r="16"/>
      <circle fill="#fff9dc" fill-opacity="0.78" cx="278" cy="256" r="4"/>
    </g>
  </g>
</svg>
