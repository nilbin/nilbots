<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Towline">
  <defs>
    <linearGradient id="towline-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5a5d61"/><stop offset=".42" stop-color="#24272b"/><stop offset="1" stop-color="#020509"/>
    </linearGradient>
    <linearGradient id="towline-plate" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#ffcc62"/><stop offset=".38" stop-color="#d39a30"/><stop offset="1" stop-color="#996000"/>
    </linearGradient>
    <linearGradient id="towline-hardware" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a8aeb1"/><stop offset=".46" stop-color="#6e7477"/><stop offset="1" stop-color="#343a3d"/>
    </linearGradient>
    <linearGradient id="towline-deep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#303337"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="towline-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#14171b"/><stop offset=".44" stop-color="#000105"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="towline-emissive">
      <stop stop-color="#fffdf0"/><stop offset=".25" stop-color="#ffffae"/><stop offset=".64" stop-color="#ffd36a"/><stop offset="1" stop-color="#a77b12"/>
    </radialGradient>
    <pattern id="towline-brush" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 2h18M0 11h18" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
      <path d="M0 7h18M0 16h18" stroke="#02050a" stroke-opacity=".24" stroke-width="1"/>
    </pattern>
    <clipPath id="towline-clip"><path d="M78 184 170 126 318 138 392 194 392 222 464 222 464 290 392 290 392 318 318 374 170 386 78 328Z"/></clipPath>
    <filter id="towline-bevel" x="-12%" y="-14%" width="128%" height="138%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="edge-blur"/>
      <feSpecularLighting in="edge-blur" surfaceScale="4.5" specularConstant=".42" specularExponent="16" lighting-color="#f7fbff" result="specular">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-cut"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="specular-cut"/></feMerge>
    </filter>
    <filter id="towline-team-glow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="glow"/>
      <feComponentTransfer in="glow" result="soft-glow"><feFuncA type="linear" slope=".58"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g id="underbody-locomotion">
      <g fill="#080b0f" stroke="#0b1118" stroke-width="12">
        <ellipse cx="164" cy="154" rx="46" ry="34"/><ellipse cx="346" cy="154" rx="46" ry="34"/>
        <ellipse cx="164" cy="358" rx="46" ry="34"/><ellipse cx="346" cy="358" rx="46" ry="34"/>
      </g>
      <g fill="#6d7479"><circle cx="164" cy="154" r="14"/><circle cx="346" cy="154" r="14"/><circle cx="164" cy="358" r="14"/><circle cx="346" cy="358" r="14"/></g>
    </g>
    <g id="chassis-depth">
      <path d="M78 184 170 126 318 138 392 194 392 222 464 222 464 290 392 290 392 318 318 374 170 386 78 328Z" transform="translate(0 22)" fill="url(#towline-side)" stroke="#05080d" stroke-width="18"/>
      <path d="M78 184 170 126 318 138 392 194 392 222 464 222 464 290 392 290 392 318 318 374 170 386 78 328Z" transform="translate(0 16)" fill="none" stroke="#36393d" stroke-opacity=".46" stroke-width="5"/>
    </g>
    <g id="chassis" filter="url(#towline-bevel)">
      <path fill="url(#towline-chassis)" stroke="#0b1118" stroke-width="18" d="M78 184 170 126 318 138 392 194 392 222 464 222 464 290 392 290 392 318 318 374 170 386 78 328Z"/>
      <path fill="url(#towline-plate)" stroke="#0b1118" stroke-width="7" d="M126 190 214 156 326 176 370 218v76l-44 42-112 20-88-34-28-66Z"/>
      <g id="material-finish" clip-path="url(#towline-clip)" opacity="0.22">
        <rect x="36" y="70" width="448" height="370" fill="url(#towline-brush)"/>
      </g>
      <g id="armor-plates" fill="url(#towline-plate)" stroke="#e9b046" stroke-width="4">
        <path d="M118 208 190 168l62 14-32 46-90 22Z"/><path fill="#915800" stroke="#b57c12" d="m130 268 90 22 32 46-62 14-72-40Z"/><path fill="url(#towline-hardware)" stroke="#868c8f" d="M276 178 342 196l34 42-58 10-42-30Z"/><path fill="#404649" stroke="#5c6265" d="m318 264 58 10-34 42-66 18v-40Z"/>
      </g>
      <g id="surface-panels" fill="none" stroke="#ffd86e" stroke-opacity=".58" stroke-width="5">
        <path d="M118 204 202 170h118l44 42M118 308l84 34h118l44-42M154 222h54m-54 68h54"/>
      </g>
      <g id="panel-shadows" fill="none" stroke="#000000" stroke-opacity=".78" stroke-width="4" transform="translate(0 5)">
        <path d="M118 204 202 170h118l44 42M118 308l84 34h118l44-42M154 222h54m-54 68h54"/>
      </g>
      <g id="fasteners" fill="#989ea1" stroke="#090d12" stroke-width="3">
        <circle cx="142" cy="208" r="6"/><circle cx="142" cy="304" r="6"/><circle cx="326" cy="194" r="6"/><circle cx="326" cy="318" r="6"/>
      </g>
    </g>
    <g id="hardware-depth">
      <circle fill="#000000" stroke="#070a0f" stroke-width="6" cx="244" cy="256" r="72" transform="translate(0 9)"/>
      <circle fill="#000000" stroke="#070a0f" stroke-width="5" cx="244" cy="256" r="34" transform="translate(0 9)"/>
      <path fill="#000000" stroke="#070a0f" stroke-width="6" d="M370 220h86v34h-54v38h54v34h-86Z" transform="translate(0 9)"/>
    </g>
    <g id="weapon-hardware">
      <circle fill="url(#towline-hardware)" stroke="#0b1118" stroke-width="6" cx="244" cy="256" r="72"/>
      <circle fill="url(#towline-chassis)" stroke="#0b1118" stroke-width="5" cx="244" cy="256" r="34"/>
      <path fill="url(#towline-hardware)" stroke="#0b1118" stroke-width="6" d="M370 220h86v34h-54v38h54v34h-86Z"/>
      <g id="signature-machinery" fill="none" stroke="#a4aaad" stroke-width="6" stroke-opacity=".88">
        <circle cx="244" cy="256" r="58"/><circle cx="244" cy="256" r="24"/><path d="m202 218 84 76m0-76-84 76M302 256h104"/>
      </g>
    </g>
    <g id="team-accents" filter="url(#towline-team-glow)">
      <rect data-team-accent="true" fill="#38bdf8" x="102" y="202" width="42" height="108" rx="18"/>
      <path data-team-accent="true" fill="#38bdf8" d="m286 182 60 26-14 30-64-24Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m286 330 60-26-14-30-64 24Z"/>
    </g>
    <g id="emissives">
      <circle fill="url(#towline-emissive)" cx="244" cy="256" r="14"/>
      <circle fill="#fff9dc" fill-opacity="0.78" cx="244" cy="256" r="4"/>
    </g>
  </g>
</svg>
