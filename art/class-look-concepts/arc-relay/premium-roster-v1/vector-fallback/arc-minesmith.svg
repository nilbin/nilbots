<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Minesmith">
  <defs>
    <linearGradient id="minesmith-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#665953"/><stop offset=".42" stop-color="#30231d"/><stop offset="1" stop-color="#0e0100"/>
    </linearGradient>
    <linearGradient id="minesmith-plate" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#da9068"/><stop offset=".38" stop-color="#a85e36"/><stop offset="1" stop-color="#6e2400"/>
    </linearGradient>
    <linearGradient id="minesmith-hardware" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe7b4"/><stop offset=".46" stop-color="#c8ad7a"/><stop offset="1" stop-color="#8e7340"/>
    </linearGradient>
    <linearGradient id="minesmith-deep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3c2f29"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="minesmith-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#20130d"/><stop offset=".44" stop-color="#0a0000"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="minesmith-emissive">
      <stop stop-color="#fffdf0"/><stop offset=".25" stop-color="#fff892"/><stop offset=".64" stop-color="#f3b44e"/><stop offset="1" stop-color="#9b5c00"/>
    </radialGradient>
    <pattern id="minesmith-brush" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 2h18M0 11h18" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
      <path d="M0 7h18M0 16h18" stroke="#02050a" stroke-opacity=".24" stroke-width="1"/>
    </pattern>
    <clipPath id="minesmith-clip"><path d="M84 204 146 138 250 126 356 154 430 218 430 294 356 358 250 386 146 374 84 308Z"/></clipPath>
    <filter id="minesmith-bevel" x="-12%" y="-14%" width="128%" height="138%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="edge-blur"/>
      <feSpecularLighting in="edge-blur" surfaceScale="4.5" specularConstant=".42" specularExponent="16" lighting-color="#f7fbff" result="specular">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-cut"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="specular-cut"/></feMerge>
    </filter>
    <filter id="minesmith-team-glow" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="glow"/>
      <feComponentTransfer in="glow" result="soft-glow"><feFuncA type="linear" slope=".58"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g id="underbody-locomotion">
      <g fill="#080b0f" stroke="#0b1118" stroke-width="12">
        <ellipse cx="164" cy="154" rx="46" ry="34"/><ellipse cx="346" cy="154" rx="46" ry="34"/>
        <ellipse cx="164" cy="358" rx="46" ry="34"/><ellipse cx="346" cy="358" rx="46" ry="34"/>
      </g>
      <g fill="#6d7479"><circle cx="164" cy="154" r="14"/><circle cx="346" cy="154" r="14"/><circle cx="164" cy="358" r="14"/><circle cx="346" cy="358" r="14"/></g>
    </g>
    <g id="chassis-depth">
      <path d="M84 204 146 138 250 126 356 154 430 218 430 294 356 358 250 386 146 374 84 308Z" transform="translate(0 22)" fill="url(#minesmith-side)" stroke="#05080d" stroke-width="18"/>
      <path d="M84 204 146 138 250 126 356 154 430 218 430 294 356 358 250 386 146 374 84 308Z" transform="translate(0 16)" fill="none" stroke="#42352f" stroke-opacity=".46" stroke-width="5"/>
    </g>
    <g id="chassis" filter="url(#minesmith-bevel)">
      <path fill="url(#minesmith-chassis)" stroke="#0b1118" stroke-width="18" d="M84 204 146 138 250 126 356 154 430 218 430 294 356 358 250 386 146 374 84 308Z"/>
      <path fill="url(#minesmith-plate)" stroke="#0b1118" stroke-width="7" d="M132 218 176 172 252 164 328 184 382 228v56l-54 44-76 20-76-8-44-46Z"/>
      <g id="material-finish" clip-path="url(#minesmith-clip)" opacity="0.22">
        <rect x="36" y="70" width="448" height="370" fill="url(#minesmith-brush)"/>
      </g>
      <g id="armor-plates" fill="url(#minesmith-plate)" stroke="#be744c" stroke-width="4">
        <path d="M126 224 176 176l70-8-22 62-84 22Z"/><path fill="#661c00" stroke="#8a4018" d="m140 270 84 22 22 62-70-8-50-48Z"/><path fill="url(#minesmith-hardware)" stroke="#e0c592" d="m276 176 58 18 44 36-62 16-52-30Z"/><path fill="#9a7f4c" stroke="#b69b68" d="m316 266 62 16-44 36-58 18-12-40Z"/>
      </g>
      <g id="surface-panels" fill="none" stroke="#e69c74" stroke-opacity=".58" stroke-width="5">
        <path d="M138 216 184 180l70-8 70 20 48 40M138 296l46 36 70 8 70-20 48-40M272 184l-24 48"/>
      </g>
      <g id="panel-shadows" fill="none" stroke="#040000" stroke-opacity=".78" stroke-width="4" transform="translate(0 5)">
        <path d="M138 216 184 180l70-8 70 20 48 40M138 296l46 36 70 8 70-20 48-40M272 184l-24 48"/>
      </g>
      <g id="fasteners" fill="#f2d7a4" stroke="#090d12" stroke-width="3">
        <circle cx="158" cy="206" r="6"/><circle cx="158" cy="306" r="6"/><circle cx="340" cy="210" r="6"/><circle cx="340" cy="302" r="6"/>
      </g>
    </g>
    <g id="hardware-depth">
      <path fill="#020000" stroke="#070a0f" stroke-width="6" d="m194 190 70-26 54 48-18 76-70 26-54-48Z" transform="translate(0 9)"/>
      <circle fill="#020000" stroke="#070a0f" stroke-width="6" cx="188" cy="326" r="48" transform="translate(0 9)"/>
      <circle fill="#020000" stroke="#070a0f" stroke-width="6" cx="334" cy="318" r="42" transform="translate(0 9)"/>
    </g>
    <g id="weapon-hardware">
      <path fill="url(#minesmith-hardware)" stroke="#0b1118" stroke-width="6" d="m194 190 70-26 54 48-18 76-70 26-54-48Z"/>
      <circle fill="url(#minesmith-chassis)" stroke="#0b1118" stroke-width="6" cx="188" cy="326" r="48"/>
      <circle fill="url(#minesmith-chassis)" stroke="#0b1118" stroke-width="6" cx="334" cy="318" r="42"/>
      <g id="signature-machinery" fill="none" stroke="#fee3b0" stroke-width="6" stroke-opacity=".88">
        <path d="m194 190 70-26 54 48-18 76-70 26-54-48Z"/><path d="m246 188 34 60-68 0Z"/><circle cx="188" cy="326" r="30"/>
      </g>
    </g>
    <g id="team-accents" filter="url(#minesmith-team-glow)">
      <path data-team-accent="true" fill="#38bdf8" d="m110 218 42-44 24 26-40 46Z"/>
      <path data-team-accent="true" fill="#38bdf8" d="m330 184 52 42-20 28-54-40Z"/>
      <circle data-team-accent="true" fill="#38bdf8" cx="188" cy="326" r="18"/>
    </g>
    <g id="emissives">
      <circle fill="url(#minesmith-emissive)" cx="247" cy="239" r="18"/>
      <circle fill="#fff9dc" fill-opacity="0.78" cx="247" cy="239" r="4"/>
    </g>
  </g>
</svg>
