<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arc Mason T2 sprite render</title>
  <style>html,body{margin:0;background:transparent}canvas{display:block}</style>
  <script type="importmap">
    { "imports": { "three": "/web/node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="sprite" width="768" height="768"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from '/web/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

    const canvas = document.getElementById('sprite');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, premultipliedAlpha:true });
    renderer.setPixelRatio(1);
    renderer.setSize(768, 768, false);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;

    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight('#bcd8e8', '#111820', 1.25));
    const key = new THREE.DirectionalLight('#fff1d8', 3.2);
    key.position.set(-1.6, 2.7, 2.1);
    scene.add(key);
    const gltf = await new GLTFLoader().loadAsync(
      '/art/class-models/provider-runs/meshy/arc-mason/019fc335-af21-735b-ac08-6215f3031b69/mason-normalized-review.glb',
    );
    gltf.scene.traverse((node) => {
      if (!node.isMesh) return;
      const materials = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of materials) material.side = THREE.FrontSide;
    });
    scene.add(gltf.scene);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 20);
    const pitch = 58 * Math.PI / 180;
    const distance = 1.35;
    camera.position.set(0, Math.sin(pitch) * distance + 0.08, Math.cos(pitch) * distance);
    camera.lookAt(0, 0.18, 0);
    renderer.render(scene, camera);
    window.__nilbotsSpriteReady = true;
  </script>
</body>
</html>
