<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Frontline deterministic module lineup</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #060504;
        color: #cfb28e;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      header {
        position: fixed;
        z-index: 2;
        top: 24px;
        left: 30px;
        right: 30px;
        display: flex;
        justify-content: space-between;
        font-size: 17px;
        letter-spacing: 0.08em;
        pointer-events: none;
      }

      .sub {
        color: #80766a;
        text-align: right;
        line-height: 1.5;
      }

      .label {
        position: fixed;
        z-index: 2;
        padding: 7px 9px;
        border: 1px solid rgba(139, 93, 55, 0.52);
        background: rgba(7, 7, 7, 0.82);
        color: #c99a6a;
        font-size: 13px;
        letter-spacing: 0.08em;
        pointer-events: none;
      }

      .straight {
        left: 17%;
        top: 23%;
      }

      .corner {
        right: 16%;
        top: 24%;
      }

      .cover {
        left: 24%;
        bottom: 18%;
      }

      .floor {
        right: 20%;
        bottom: 18%;
      }
    </style>
  </head>
  <body>
    <header>
      <div>EMBER FORGE · DETERMINISTIC KIT LINEUP</div>
      <div class="sub">58° GAMEPLAY CAMERA<br />MAP-AUTHORITATIVE · NO WHOLE-MAP MESH</div>
    </header>
    <div class="label straight">PERIMETER · STRAIGHT</div>
    <div class="label corner">PERIMETER · CORNER / END</div>
    <div class="label cover">INTERIOR · LOW COVER</div>
    <div class="label floor">CONTINUOUS FLOOR / ROUGHNESS</div>

    <script type="module">
      import * as THREE from '/three.module.js';

      const CAMERA_PITCH = (58 * Math.PI) / 180;
      const loader = new THREE.TextureLoader();
      const [
        floorTexture,
        perimeterAlbedo,
        perimeterNormal,
        perimeterRoughness,
        coverAlbedo,
        coverNormal,
        coverRoughness,
      ] = await Promise.all([
        texture('/floor.webp', true),
        texture('/perimeter-albedo.png', true),
        texture('/perimeter-normal.png'),
        texture('/perimeter-roughness.png'),
        texture('/cover-albedo.png', true),
        texture('/cover-normal.png'),
        texture('/cover-roughness.png'),
      ]);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060504);
      scene.fog = new THREE.Fog(0x060504, 10, 24);

      const camera = new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      const target = new THREE.Vector3(6, 0, 4);
      const span = Math.max(12 / camera.aspect, 8);
      const distance = (span / 2) / Math.tan((camera.fov * Math.PI) / 360);
      camera.position.set(
        target.x,
        Math.sin(CAMERA_PITCH) * distance * 1.12,
        target.z + Math.cos(CAMERA_PITCH) * distance * 1.12,
      );
      camera.lookAt(target);

      const perimeter = new THREE.MeshStandardMaterial({
        map: perimeterAlbedo,
        normalMap: perimeterNormal,
        normalScale: new THREE.Vector2(0.52, 0.52),
        roughnessMap: perimeterRoughness,
        roughness: 0.93,
        metalness: 0.3,
        color: 0xb9b2a9,
      });
      const cover = new THREE.MeshStandardMaterial({
        map: coverAlbedo,
        normalMap: coverNormal,
        normalScale: new THREE.Vector2(0.46, 0.46),
        roughnessMap: coverRoughness,
        roughness: 0.9,
        metalness: 0.22,
        color: 0xc1bbb2,
      });
      const copper = new THREE.MeshStandardMaterial({
        color: 0x7b3f20,
        roughness: 0.66,
        metalness: 0.64,
      });
      const ceramic = new THREE.MeshStandardMaterial({
        color: 0x715738,
        roughness: 0.88,
        metalness: 0.04,
      });
      const amber = new THREE.MeshStandardMaterial({
        color: 0x5d2410,
        emissive: 0x8a2f08,
        emissiveIntensity: 0.72,
        roughness: 0.76,
        metalness: 0.2,
      });

      addFloor();
      addPerimeterStraight();
      addPerimeterCorner();
      addCover();
      addLights();

      renderer.render(scene, camera);
      document.body.dataset.ready = '1';

      async function texture(url, srgb = false) {
        const loaded = await loader.loadAsync(url);
        loaded.wrapS = THREE.RepeatWrapping;
        loaded.wrapT = THREE.RepeatWrapping;
        loaded.anisotropy = 8;
        if (srgb) loaded.colorSpace = THREE.SRGBColorSpace;
        return loaded;
      }

      function addFloor() {
        const geometry = new THREE.PlaneGeometry(12, 8);
        geometry.rotateX(-Math.PI / 2);
        geometry.translate(6, 0, 4);
        const material = new THREE.MeshStandardMaterial({
          map: floorTexture,
          bumpMap: floorTexture,
          bumpScale: 0.038,
          color: 0xb4aea6,
          roughness: 0.91,
          metalness: 0.24,
        });
        const floor = new THREE.Mesh(geometry, material);
        floor.receiveShadow = true;
        scene.add(floor);

        const wear = new THREE.Mesh(
          new THREE.CircleGeometry(1.3, 48).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({
            color: 0x744124,
            transparent: true,
            opacity: 0.07,
            depthWrite: false,
          }),
        );
        wear.position.set(8.8, 0.004, 5.9);
        wear.scale.set(1.8, 1, 0.48);
        wear.rotation.y = -0.42;
        scene.add(wear);
      }

      function addPerimeterStraight() {
        const body = shapedBlock(
          sweptStraight(3.2, 0.9),
          0.72,
          0.06,
          perimeter,
        );
        body.position.set(3.1, 0, 2.25);
        scene.add(body);

        addCap(2.55, 0.72, 2.25, 0.88, 0.28, 0);
        addCap(3.58, 0.72, 2.25, 0.72, 0.3, 0);
        addBand(4.12, 0.735, 2.25, Math.PI / 2);
        addVent(2.0, 0.738, 2.25, 0);
      }

      function addPerimeterCorner() {
        const points = [
          [-1.58, -0.28],
          [-1.4, -0.46],
          [0.34, -0.46],
          [0.5, -0.3],
          [0.5, 1.32],
          [0.32, 1.52],
          [-0.3, 1.52],
          [-0.48, 1.34],
          [-0.48, 0.52],
          [-1.38, 0.52],
          [-1.58, 0.32],
        ];
        const shape = roundedPolygon(points, 0.23);
        const geometry = extrude(shape, 0.72, 0.06);
        projectBoundsUvs(geometry);
        const mesh = new THREE.Mesh(geometry, perimeter);
        mesh.position.set(8.75, 0, 1.9);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);

        addCap(8.0, 0.72, 1.9, 0.78, 0.29, 0);
        addCap(9.22, 0.72, 2.72, 0.72, 0.3, Math.PI / 2);
        addBand(8.75, 0.738, 1.9, Math.PI / 2);
        addVent(9.22, 0.738, 3.02, Math.PI / 2);
      }

      function addCover() {
        const body = shapedBlock(
          sweptCover(2.5, 0.78),
          0.46,
          0.055,
          cover,
        );
        body.position.set(3.5, 0, 5.65);
        scene.add(body);
        addService(3.05, 0.474, 5.65, -0.05);
        addCap(3.92, 0.46, 5.65, 0.72, 0.25, 0);
        addBand(4.5, 0.478, 5.65, Math.PI / 2);
        addVent(2.62, 0.478, 5.65, 0);
      }

      function block(width, depth, height, radius, bevel, material) {
        const shape = roundedRect(width, depth, radius);
        return shapedBlock(shape, height, bevel, material);
      }

      function shapedBlock(shape, height, bevel, material) {
        const geometry = extrude(shape, height, bevel);
        projectBoundsUvs(geometry);
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function sweptStraight(width, depth) {
        const halfWidth = width / 2;
        const halfDepth = depth / 2;
        return roundedPolygon(
          [
            [-halfWidth, -halfDepth * 0.58],
            [-halfWidth * 0.84, -halfDepth],
            [halfWidth * 0.76, -halfDepth],
            [halfWidth, -halfDepth * 0.48],
            [halfWidth * 0.97, halfDepth * 0.52],
            [halfWidth * 0.78, halfDepth],
            [-halfWidth * 0.82, halfDepth],
            [-halfWidth, halfDepth * 0.5],
          ],
          0.13,
        );
      }

      function sweptCover(width, depth) {
        const halfWidth = width / 2;
        const halfDepth = depth / 2;
        return roundedPolygon(
          [
            [-halfWidth, -halfDepth * 0.42],
            [-halfWidth * 0.82, -halfDepth * 0.88],
            [-halfWidth * 0.28, -halfDepth],
            [0, -halfDepth * 0.78],
            [halfWidth * 0.4, -halfDepth],
            [halfWidth * 0.85, -halfDepth * 0.74],
            [halfWidth, -halfDepth * 0.32],
            [halfWidth * 0.92, halfDepth * 0.58],
            [halfWidth * 0.72, halfDepth * 0.9],
            [halfWidth * 0.24, halfDepth],
            [-halfWidth * 0.1, halfDepth * 0.8],
            [-halfWidth * 0.5, halfDepth],
            [-halfWidth * 0.88, halfDepth * 0.68],
          ],
          0.11,
        );
      }

      function roundedRect(width, depth, radius) {
        return roundedPolygon(
          [
            [-width / 2, -depth / 2],
            [width / 2, -depth / 2],
            [width / 2, depth / 2],
            [-width / 2, depth / 2],
          ],
          radius,
        );
      }

      function roundedPolygon(points, requestedRadius) {
        const vectors = points.map(([x, y]) => new THREE.Vector2(x, y));
        let radius = requestedRadius;
        for (let index = 0; index < vectors.length; index += 1)
          radius = Math.min(
            radius,
            vectors[index].distanceTo(vectors[(index + 1) % vectors.length]) / 2,
          );
        const path = new THREE.Shape();
        const approach = (corner, towards) =>
          corner
            .clone()
            .addScaledVector(towards.clone().sub(corner).normalize(), radius);
        for (let index = 0; index < vectors.length; index += 1) {
          const previous = vectors[(index - 1 + vectors.length) % vectors.length];
          const corner = vectors[index];
          const next = vectors[(index + 1) % vectors.length];
          const entry = approach(corner, previous);
          const exit = approach(corner, next);
          if (index === 0) path.moveTo(entry.x, entry.y);
          else path.lineTo(entry.x, entry.y);
          path.quadraticCurveTo(corner.x, corner.y, exit.x, exit.y);
        }
        path.closePath();
        return path;
      }

      function extrude(shape, height, bevel) {
        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: height - bevel,
          bevelEnabled: true,
          bevelThickness: bevel,
          bevelSize: bevel,
          bevelSegments: 3,
          curveSegments: 8,
        });
        geometry.rotateX(-Math.PI / 2);
        geometry.computeVertexNormals();
        return geometry;
      }

      function projectBoundsUvs(geometry) {
        geometry.computeBoundingBox();
        const bounds = geometry.boundingBox;
        const width = Math.max(bounds.max.x - bounds.min.x, 1e-6);
        const height = Math.max(bounds.max.y - bounds.min.y, 1e-6);
        const depth = Math.max(bounds.max.z - bounds.min.z, 1e-6);
        const position = geometry.attributes.position;
        const normal = geometry.attributes.normal;
        const uv = geometry.attributes.uv;
        for (let vertex = 0; vertex < position.count; vertex += 1) {
          const x = position.getX(vertex);
          const y = position.getY(vertex);
          const z = position.getZ(vertex);
          if (Math.abs(normal.getY(vertex)) > 0.5)
            uv.setXY(
              vertex,
              (x - bounds.min.x) / width,
              1 - (z - bounds.min.z) / depth,
            );
          else if (Math.abs(normal.getX(vertex)) > 0.5)
            uv.setXY(
              vertex,
              (z - bounds.min.z) / depth,
              (y - bounds.min.y) / height,
            );
          else
            uv.setXY(
              vertex,
              (x - bounds.min.x) / width,
              (y - bounds.min.y) / height,
            );
        }
        uv.needsUpdate = true;
      }

      function addCap(x, y, z, width, depth, rotation) {
        const cap = block(width, depth, 0.055, Math.min(0.13, depth / 2), 0.015, cover);
        cap.position.set(x, y, z);
        cap.rotation.y = rotation;
        scene.add(cap);
      }

      function addBand(x, y, z, rotation) {
        const band = block(0.42, 0.055, 0.024, 0.02, 0.006, copper);
        band.position.set(x, y, z);
        band.rotation.y = rotation;
        scene.add(band);
      }

      function addVent(x, y, z, rotation) {
        const vent = block(0.3, 0.075, 0.018, 0.018, 0.004, amber);
        vent.position.set(x, y, z);
        vent.rotation.y = rotation;
        scene.add(vent);
      }

      function addService(x, y, z, rotation) {
        const service = block(0.4, 0.24, 0.025, 0.04, 0.006, ceramic);
        service.position.set(x, y, z);
        service.rotation.y = rotation;
        scene.add(service);
      }

      function addLights() {
        const key = new THREE.DirectionalLight(0xffead5, 4.4);
        key.position.set(9, 13, 8);
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.camera.left = -8;
        key.shadow.camera.right = 8;
        key.shadow.camera.top = 8;
        key.shadow.camera.bottom = -8;
        key.shadow.camera.far = 35;
        key.shadow.bias = -0.0014;
        key.shadow.normalBias = 0.018;
        const ambient = new THREE.AmbientLight(0x777d8e, 2.55);
        const fill = new THREE.DirectionalLight(0x704126, 1.15);
        fill.position.set(-7, 6, -5);
        scene.add(key, key.target, ambient, fill);
      }
    </script>
  </body>
</html>
