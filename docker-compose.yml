# Local/pilot deployment: `docker compose up -d --build`, then open :8080.
# Internet-facing production uses deploy/compose.production.yml.
#
# For Google sign-in, pass the credential file so the values interpolate:
#   docker compose --env-file deploy/.env up -d --build
# Without it both variables resolve empty, which is a supported state rather
# than a broken one: the app registers no OpenIddict client and hides the
# button, so plain `docker compose up` still gives a working site with
# password sign-in only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: botarena
      POSTGRES_PASSWORD: botarena
      POSTGRES_DB: botarena
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Keep direct `dotnet run` and the Compose app on the same canonical
      # local database instead of silently creating two development worlds.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botarena"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    platform: linux/amd64
    build:
      context: .
      # `runtime` (215 MB) rather than `compiler` (9.7 GB). The compiler stage
      # carries the .NET SDK, clang/LLVM and the wasi-sdk so it can build
      # player-submitted code in a sandbox. Play is sheet-driven today: sheets
      # are data interpreted by the built-in tactical mind, which ships as the
      # committed artifacts/wasm/builtin-bots.wasm and is only rebuilt by
      # scripts/build-wasm-guest.sh during development. Nothing compiles at
      # request time, so the toolchain is 9.5 GB of unused weight locally.
      #
      # Override to bring code submissions back:
      #   BOTARENA_COMPOSE_TARGET=compiler docker compose up -d --build
      target: ${BOTARENA_COMPOSE_TARGET:-runtime}
    ports:
      - "8080:8080"
    environment:
      BOTARENA_DB: "Host=db;Database=botarena;Username=botarena;Password=botarena"
      BOTARENA_ROLE: "all"
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      # This site is http://127.0.0.1:8080, and OpenIddict will not start a
      # sign-in challenge over plain HTTP without being told to. Local only —
      # deploy/compose.production.yml deliberately does not set this, and
      # production serves HTTPS through Caddy.
      BOTARENA_ALLOW_INSECURE_AUTH: "true"
    volumes:
      - appdata:/data
      - buildcache:/root/.botarena
      - botbuildhome:/var/lib/botbuild
    init: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    # An explicit name keeps this database stable if the Compose project name
    # changes (for example when launched from a different checkout path).
    name: nilbots_pgdata
  appdata:
  buildcache:
  botbuildhome:
