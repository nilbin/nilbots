# Local/pilot deployment: `docker compose up -d --build`, then open :8080.
# Internet-facing production uses deploy/compose.production.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: botarena
      POSTGRES_PASSWORD: botarena
      POSTGRES_DB: botarena
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botarena"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    platform: linux/amd64
    build:
      context: .
      target: compiler
    ports:
      - "8080:8080"
    environment:
      BOTARENA_DB: "Host=db;Database=botarena;Username=botarena;Password=botarena"
      BOTARENA_ROLE: "all"
    volumes:
      - appdata:/data
      - buildcache:/root/.botarena
      - botbuildhome:/var/lib/botbuild
    init: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  appdata:
  buildcache:
  botbuildhome:
