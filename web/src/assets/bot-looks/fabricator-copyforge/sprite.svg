<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Copyforge fabricator chassis facing east">
  <defs>
    <linearGradient id="cf-frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#66727a"/>
      <stop offset=".48" stop-color="#2e3b42"/>
      <stop offset="1" stop-color="#10191e"/>
    </linearGradient>
    <linearGradient id="cf-copper" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c3f2b"/>
      <stop offset=".52" stop-color="#c87948"/>
      <stop offset="1" stop-color="#5e2d24"/>
    </linearGradient>
  </defs>

  <!-- One complete chassis with empty outward-facing tools: copies appear as other lives. -->
  <path d="M68 256 106 156l82-58 92 30 70 72 78-52 42 26-58 82 58 82-42 26-78-52-70 72-92 30-82-58Z"
    fill="#070d10" stroke="#070a0c" stroke-width="18" stroke-linejoin="round"/>
  <path d="m82 256 34-91 75-53 84 28 62 65-33 51 33 51-62 65-84 28-75-53Z"
    fill="url(#cf-frame)" stroke="#738088" stroke-width="6"/>

  <!-- Open lattice leaves negative space so a crowd of copies does not merge into blobs. -->
  <g fill="#121b20" stroke="#7b878e" stroke-width="6" stroke-linejoin="round">
    <path d="m118 168 62-44 30 21-55 62Z"/>
    <path d="m118 344 62 44 30-21-55-62Z"/>
    <path d="m204 138 67 20 36 46-54 18-44-35Z"/>
    <path d="m204 374 67-20 36-46-54-18-44 35Z"/>
    <path d="m100 216 55-20 32 38-33 22-53-12Z"/>
    <path d="m100 296 55 20 32-38-33-22-53 12Z"/>
  </g>
  <g fill="url(#cf-copper)" stroke="#2b1712" stroke-width="3">
    <path d="m142 155 35-24 12 12-35 30Z"/>
    <path d="m142 357 35 24 12-12-35-30Z"/>
    <path d="m224 151 35 10 13 16-41 6Z"/>
    <path d="m224 361 35-10 13-16-41-6Z"/>
  </g>

  <!-- Twin empty manipulators point out into the world, never back into the hull. -->
  <g fill="url(#cf-frame)" stroke="#7b878e" stroke-width="5" stroke-linejoin="round">
    <path d="m292 205 55-33 36 12 45-32 24 18-50 49-41-3-42 35Z"/>
    <path d="m292 307 55 33 36-12 45 32 24-18-50-49-41 3-42-35Z"/>
  </g>
  <g fill="#1c272d" stroke="#9aa5ab" stroke-width="4">
    <path d="m418 146 41 8 18 20-19 20-22-10 18-12-25-8Z"/>
    <path d="m418 366 41-8 18-20-19-20-22 10 18 12-25 8Z"/>
  </g>
  <path d="m328 244 82 4 34 8-34 8-82 4 10-12Z" fill="#1a2429" stroke="#7d8990" stroke-width="4"/>
  <path data-team-accent="true" d="m342 249 68 7-68 7 8-7Z" fill="#34d399"/>

  <circle cx="224" cy="256" r="91" fill="#0f171b" stroke="#78858c" stroke-width="8"/>
  <circle cx="224" cy="256" r="69" fill="#25333a" stroke="#11191e" stroke-width="8"/>
  <path d="m224 198 50 29v58l-50 29-50-29v-58Z" fill="#172228" stroke="#637078" stroke-width="6"/>
  <circle data-team-accent="true" cx="224" cy="256" r="43" fill="#34d399"/>
  <circle cx="224" cy="256" r="30" fill="#0d1b18" stroke="#a7f3d0" stroke-width="5"/>
  <path data-team-accent="true" d="m224 235 18 10v22l-18 10-18-10v-22Z" fill="#d1fae5"/>

  <path data-team-accent="true" d="M121 249h67l12 7-12 7h-67Z" fill="#34d399"/>
  <path data-team-accent="true" d="m296 190 38-12 13 8-43 18Z" fill="#34d399"/>
  <path data-team-accent="true" d="m296 322 38 12 13-8-43-18Z" fill="#34d399"/>
  <g fill="#a4afb5">
    <circle cx="142" cy="187" r="4"/>
    <circle cx="142" cy="325" r="4"/>
    <circle cx="286" cy="177" r="4"/>
    <circle cx="286" cy="335" r="4"/>
  </g>
</svg>
