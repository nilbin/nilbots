<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rivet Mantis fabricator chassis facing east">
  <defs>
    <linearGradient id="rm-hull" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#626b6f"/>
      <stop offset=".45" stop-color="#323b3f"/>
      <stop offset="1" stop-color="#131a1d"/>
    </linearGradient>
    <linearGradient id="rm-yellow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a66e12"/>
      <stop offset=".5" stop-color="#e7a91d"/>
      <stop offset="1" stop-color="#73500f"/>
    </linearGradient>
  </defs>

  <!-- A compact ring chassis and four independent tools remain readable in a crowd. -->
  <path d="M72 256 102 170l72-50 78 20 66 54 66-48 60 14 34 47-44 49 44 49-34 47-60 14-66-48-66 54-78 20-72-50Z"
