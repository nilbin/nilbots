  <path d="m86 256 26-77 65-45 71 18 58 49-30 55 30 55-58 49-71 18-65-45Z"
    fill="url(#rm-hull)" stroke="#727c82" stroke-width="6"/>

  <!-- Four yellow service pods are authored skin color, not allegiance. -->
  <g fill="url(#rm-yellow)" stroke="#39280c" stroke-width="5">
    <path d="m112 179 57-37 39 10-21 52-58 18Z"/>
    <path d="m112 333 57 37 39-10-21-52-58-18Z"/>
    <path d="m253 159 55 44-23 43-52-32Z"/>
